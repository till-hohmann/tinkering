<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Ninefold</title>
  <meta name="theme-color" content="#0f1115" />
  <link rel="manifest" href="./manifest.webmanifest" />

  <!-- iOS standalone (requirements §2) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- "black" (not black-translucent): iOS reserves the status-bar area so app
       content starts below the clock/notch instead of sliding under it. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Ninefold" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <main id="view" class="view"></main>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
