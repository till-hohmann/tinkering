name = "ninefold-whoop"
main = "src/index.js"
compatibility_date = "2024-11-01"

# ninefold-whoop — OAuth broker + read-only proxy between the Ninefold PWA and the
# WHOOP API. Deployed separately from the Pages app:
#   cd whoop-worker && npx wrangler deploy
#
# SECRETS (set once, never committed — see README.md):
#   wrangler secret put WHOOP_CLIENT_ID
#   wrangler secret put WHOOP_CLIENT_SECRET
#
# KV holds ONLY WHOOP OAuth tokens (keyed by a hash of the device link id) and
# short-lived OAuth state — never any health data.
[[kv_namespaces]]
binding = "STRONG_WHOOP"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"   # wrangler kv namespace create WHOOP

[vars]
# The app origin allowed to call this worker (CORS) and to return to after auth.
APP_ORIGIN = "https://your-app.pages.dev"
